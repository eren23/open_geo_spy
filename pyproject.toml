[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-geo-spy"
version = "0.3.2"
description = "Production-grade multi-agent geolocation system"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    # Core
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.31",
    "python-dotenv>=1.2.2",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.14.2",
    "sse-starlette>=2.0.0",

    # Agentic orchestration
    "langgraph>=0.2.0",

    # Logging & retry
    "loguru>=0.7.2",
    "tenacity>=8.2.3",

    # LLM / AI
    "openai>=1.30.0",

    # ML Models
    "torch>=2.13.0",
    "torchvision>=0.15.0",
    "transformers>=5.10.0,<6.0.0",
    "open-clip-torch>=2.24.0",

    # Image processing
    "pillow>=13.0.0",
    "piexif>=1.1.3",
    "numpy>=1.24.0",

    # Browser / web
    "browser-use>=0.11.0",
    "curl-cffi>=0.15.0",
    "aiohttp>=3.14.4",
    "aiofiles>=23.2.0",
    "httpx>=0.27.0",

    # Geo
    "shapely>=2.0.0",
    "geopy>=2.5.0",
    "overpy>=0.7",
    "geoclip>=1.2.0",
    "playwright>=1.40.0",
    "reverse-geocoder>=1.5.1",

    # Data
    "orjson>=3.9.0",

    # Calibration
    "scikit-learn>=1.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
]

cli = [
    "typer>=0.12.0",
    "rich>=13.0.0",
]

stealth = [
    "browser-use-undetected>=0.1.0",
    "camoufox>=0.4.0",
]

[project.scripts]
ogs = "src.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests requiring external services",
]

[tool.uv]
# Security floors for transitive dependencies reported by Dependabot.
constraint-dependencies = [
    "anyio>=4.14.2",
    "authlib>=1.6.12",
    "certifi>=2026.10.19",
    "cryptography>=50.0.0",
    "filelock>=4.2.1",
    "fsspec>=2026.6.0",
    "httplib2>=0.32.0",
    "idna>=3.15",
    "langchain-core>=1.3.3",
    "langgraph-checkpoint>=4.1.1",
    "langgraph-sdk>=0.4.4",
    "langsmith>=0.8.18",
    "lxml>=6.1.0",
    "mcp>=1.30.0",
    "multidict>=6.9.1",
    "oauthlib>=4.0.0",
    "pyasn1>=0.6.4",
    "pygments>=2.20.0",
    "pyjwt>=2.15.0",
    "pypdf>=6.21.1",
    "requests>=2.33.0",
    "setuptools>=83.0.0",
    "soupsieve>=2.9.0",
    "starlette>=1.3.1",
    "urllib3>=2.8.0",
]
